[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkgq"
version = "0.1.1"
description = "Package Query - Find API information for Python packages"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Christophe VG", email = "contact@christophe.vg"}]
keywords = ["package", "query", "api", "documentation", "mcp", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
mcp = [
  "fastmcp>=3.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.13.0",
  "ruff>=0.8.0",
  "build>=1.0.0",
  "twine>=6.0.0",
]

[project.scripts]
pkgq = "pkgq.cli:main"
pkgq-mcp-server = "pkgq.mcp:run"

[project.urls]
Homepage = "https://github.com/christophevg/pkgq"
Documentation = "https://github.com/christophevg/pkgq#readme"
Repository = "https://github.com/christophevg/pkgq"
Issues = "https://github.com/christophevg/pkgq/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pkgq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=pkgq --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py310"
indent-width = 2

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["pkgq"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]